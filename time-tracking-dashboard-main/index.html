<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

 <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">

        <!-- perfil -->
        <section class="perfil">

            <div class="perfil-topo">

                <img src= "images/image-jeremy.png" alt="Foto de perfil">

                <p>Report for</p>

                <h1>Jeremy<br>Robson</h1>

            </div>

            <div class="periodos">
                <span>Daily</span>
                <span class="ativo">Weekly</span>
                <span>Monthly</span>
            </div>

        </section>


        
        <section class="cards">

            <!-- work -->
            <div class="card-container work">
               <img src="images/icon-work.svg" alt="">

                <div class="card">
                    <div class="card-titulo">
                        <h2>Work</h2>
                        <img src="images/icon-ellipsis.svg" alt="">
                    </div>

                    <p class="horas">32hrs</p>
                    <p class="semana">Last Week - 36hrs</p>
                </div>
            </div>


            <!-- play -->
            <div class="card-container play">
                <img src="images/icon-play.svg" alt="">

                <div class="card">
                    <div class="card-titulo">
                        <h2>Play</h2>
                        <img src="images/icon-ellipsis.svg" alt="">
                    </div>

                    <p class="horas">10hrs</p>
                    <p class="semana">Last Week - 8hrs</p>
                </div>
            </div>


            <!-- study -->
            <div class="card-container study">
                <img src="images/icon-study.svg" alt="">

                <div class="card">
                    <div class="card-titulo">
                        <h2>Study</h2>
                       <img src="images/icon-ellipsis.svg" alt="">
                    </div>

                    <p class="horas">4hrs</p>
                    <p class="semana">Last Week - 7hrs</p>
                </div>
            </div>


            <!-- exercise -->
            <div class="card-container exercise">
                <img src="images/icon-exercise.svg" alt="">

                <div class="card">
                    <div class="card-titulo">
                        <h2>Exercise</h2>
                       <img src="images/icon-ellipsis.svg" alt="">
                    </div>

                    <p class="horas">4hrs</p>
                    <p class="semana">Last Week - 5hrs</p>
                </div>
            </div>


             <!-- social -->
            <div class="card-container social">
               <img src="images/icon-social.svg" alt="">

                <div class="card">
                    <div class="card-titulo">
                        <h2>Social</h2>
                       <img src="images/icon-ellipsis.svg" alt="">
                    </div>

                    <p class="horas">5hrs</p>
                    <p class="semana">Last Week - 10hrs</p>
                </div>
            </div>


            <!-- self care -->
            <div class="card-container selfcare">
                <img src="images/icon-self-care.svg" alt="">

                <div class="card">
                    <div class="card-titulo">
                        <h2>Self Care</h2>
                        <img src="images/icon-ellipsis.svg" alt="">
                    </div>

                    <p class="horas">2hrs</p>
                    <p class="semana">Last Week - 2hrs</p>
                </div>
            </div>

        </section>

    </main>
  
</body>
</html>
